name: "Sandbox settings end to end on Windows"
on:
  push:
    branches: [t3c-*]
  workflow_dispatch:
jobs:
  sb_e2e:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: studio/backend
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: '"UNSLOTH_STUDIO_HOME=$env:RUNNER_TEMP\studio" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - run: python -m pip install -q -r studio/backend/requirements/studio.txt pytest python-multipart aiofiles sqlalchemy cryptography psutil pyyaml jinja2 requests httpx "numpy<3"
      - name: Install the MXC runtime only (no host preparation, no manual grants)
        shell: pwsh
        run: |
          $dir = "$env:UNSLOTH_STUDIO_HOME\mxc-runtime\windows-x86_64"
          python studio/install_mxc_prebuilt.py --install-dir $dir | Out-Null; "install exit=$LASTEXITCODE"
          git --version; (Get-Command git).Source
      - name: Settings API end to end
        shell: pwsh
        run: |
          python -u sb_e2e.py 2>&1 | Select-String -NotMatch '"level": "info"|\[info'
          "e2e exit=$LASTEXITCODE"
